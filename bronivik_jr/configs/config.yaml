app:
  name: "bronivik-go"
  environment: "staging"  # production/staging
  version: "1.0.0"

telegram:
  bot_token: ${BOT_TOKEN}
  webhook_url: ""  # если используем webhook
  debug: true

managers:
  - 123456789
  - 987654321

managers_contacts:
  - "Manager One: set a private contact in a local override"
  - "Manager Two: set a private contact in a local override"

blacklist:
  - 111111111
  - 222222222

exports:
  path: "./exports/"

database:
  path: "${JR_DB_PATH:-./data/bookings.db}"

redis:
  address: "${REDIS_ADDR:-}"
  password: ""
  db: 0
  pool_size: 10

backup:
  enabled: true
  schedule: "24h"  # интервал между бэкапами
  retention_days: 30
  storage_path: "/var/backups/bot"

monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  health_check_port: 8080
  log_level: "info"  # debug/info/warn/error

logging:
  level: "${LOG_LEVEL:-info}"
  format: "json"  # json/text
  output: "stdout" # stdout/file
  file_path: "/var/log/bot/app.log"

google:
  credentials_file: "${GOOGLE_CREDENTIALS_FILE:-}"
  users_spreadsheet_id: "${USERS_SPREADSHEET_ID:-}"
  bookings_spreadsheet_id: "${BOOKINGS_SPREADSHEET_ID:-}"

bot:
  reminder_time: "09:00"
  pagination_size: 8
  max_booking_days: 365
  min_booking_advance: 0 # hours

api:
  enabled: true
  http:
    enabled: true
    port: ${JR_API_HTTP_PORT:-8080}
  grpc:
    port: ${JR_API_GRPC_PORT:-8081}
    reflection: true
    tls:
      enabled: false
      cert_file: "./certs/server.crt"
      key_file: "./certs/server.key"
      client_ca_file: "./certs/ca.crt"
      require_client_cert: true
  auth:
    enabled: ${JR_API_AUTH_ENABLED:-true}
    header_api_key: "x-api-key"
    header_extra: "x-api-extra"
    api_keys:
      - key: "${CRM_API_KEY:-}"
        extra: "${CRM_API_EXTRA:-}"
        name: "bronivik_crm"
        permissions: ["read:availability", "read:items"]
  rate_limit:
    rps: 5
    burst: 10
