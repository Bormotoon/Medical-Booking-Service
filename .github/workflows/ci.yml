name: CI/CD

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  GOLANGCI_LINT_VERSION: v1.64.8

jobs:
  verify:
    name: Verify (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: bronivik_jr
            go_version_file: bronivik_jr/go.mod
            make_target: ci-jr
          - module: bronivik_crm
            go_version_file: bronivik_crm/go.mod
            make_target: ci-crm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go_version_file }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run local CI target
        run: make ${{ matrix.make_target }} GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        module: [bronivik_jr, bronivik_crm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.module }}
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Тег БЕЗ префикса `v` (0.28.0) upstream снёс — job падал на
      # «Unable to resolve action ... unable to find version». Живые теги
      # только вида vX.Y.Z; закреплены на актуальном v0.36.0.
      - name: Run Trivy vulnerability scanner (bronivik_jr)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './bronivik_jr'
          format: 'sarif'
          output: 'trivy-jr-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (bronivik_crm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './bronivik_crm'
          format: 'sarif'
          output: 'trivy-crm-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results (bronivik_jr)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: 'trivy-jr-results.sarif'
          category: bronivik_jr

      - name: Upload Trivy scan results (bronivik_crm)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: 'trivy-crm-results.sarif'
          category: bronivik_crm

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deployment triggered for commit ${{ github.sha }}"
          echo "Images pushed to ghcr.io/${{ github.repository }}"
          # Add your deployment commands here
          # e.g., SSH to server, pull new images, restart containers
